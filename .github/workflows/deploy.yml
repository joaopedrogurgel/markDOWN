# Checks every push and pull request; publishes main to GitHub Pages.
name: CI e deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint, testes e corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Includes the corpus quality gate: no document may score below its baseline.
      - run: npm run check

  e2e:
    name: Testes no navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  build:
    name: Build e limite de tamanho
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pages serves the site at https://<usuario>.github.io/<repositorio>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional: set these as repository variables to turn on telemetry.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
      - run: npm run size
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
